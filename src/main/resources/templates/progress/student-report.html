<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#0c1222"/>
    <title>Progress Report — RoadSync</title>
    <link rel="stylesheet" th:href="@{/landing.css}"/>
    <link rel="stylesheet" th:href="@{/subsystem.css}"/>
</head>
<body class="rs-landing">

<header th:replace="~{fragments/roadsync :: header('other')}"></header>

<main class="rs-main student-shell">
    <nav th:replace="~{fragments/roadsync :: staffToolbar}"></nav>

    <div class="rs-page-nav">
        <span class="nav-brand">Progress report</span>
        <div class="nav-links">
            <a th:href="@{/students}">Back to students</a>
        </div>
    </div>

    <div class="table-container">
        <h2>Report: <span th:text="${student.name}" style="color: var(--rs-accent);">Student</span></h2>
        <p style="color: var(--rs-muted); margin: 0 0 1rem;">
            License goal:
            <span th:text="${student.licenseDisplay}" style="color: var(--rs-teal); font-weight: 600;">—</span>
        </p>

        <p th:if="${param.saved}" class="success-msg">Progress note saved.</p>
        <p th:if="${param.deleted}" class="success-msg">Progress note deleted.</p>

        <table>
            <thead>
            <tr>
                <th>Date &amp; time</th>
                <th>Lesson topic</th>
                <th>Instructor notes</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="note : ${notes}">
                <td th:text="${note.dateFormatted}" style="font-weight: 600;"></td>
                <td th:text="${note.lessonTopic}"></td>
                <td th:text="${note.instructorNote}"></td>
                <td>
                    <form th:action="@{/progress/delete}" method="post" style="display:inline;"
                          onsubmit="return confirm('Delete this progress note?');">
                        <input type="hidden" name="id" th:value="${note.id}"/>
                        <input type="hidden" name="studentId" th:value="${student.id}"/>
                        <button type="submit" class="delete-btn" style="border:none; cursor:pointer;">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(notes)}">
                <td colspan="4" style="text-align: center; color: var(--rs-muted);">No progress notes yet.</td>
            </tr>
            </tbody>
        </table>

        <div style="text-align: center;">
            <a th:href="@{/progress/add}" class="rs-inline-link">+ Log new progress</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/roadsync :: footer}"></footer>
<script th:replace="~{fragments/roadsync :: login-dropdown-script}"></script>
</body>
</html>
