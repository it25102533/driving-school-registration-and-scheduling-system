<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#0c1222"/>
    <title>Log Progress — RoadSync</title>
    <link rel="stylesheet" th:href="@{/landing.css}"/>
    <link rel="stylesheet" th:href="@{/subsystem.css}"/>
</head>
<body class="rs-landing">

<header th:replace="~{fragments/roadsync :: header('other')}"></header>

<main class="rs-main student-shell">
    <nav th:replace="~{fragments/roadsync :: staffToolbar}"></nav>

    <div class="rs-page-nav">
        <span class="nav-brand">Progress</span>
        <div class="nav-links">
            <a th:href="@{/instructor/dashboard}">Staff dashboard</a>
            <a th:href="@{/students}">Students</a>
        </div>
    </div>

    <div class="form-wrapper">
        <div class="form-container rs-form-wide">
            <h2>Log lesson progress</h2>

            <form th:action="@{/progress/save}" th:object="${progressNote}" method="post">
                <label for="studentId">Student</label>
                <select id="studentId" th:field="*{studentId}" required>
                    <option value="" disabled selected>— Choose a student —</option>
                    <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.name}"></option>
                </select>

                <label for="lessonTopic">Lesson topic</label>
                <input type="text" id="lessonTopic" th:field="*{lessonTopic}" placeholder="e.g. Parallel parking" required>

                <label for="instructorNote">Instructor notes</label>
                <textarea id="instructorNote" th:field="*{instructorNote}" rows="4" placeholder="How did the student do?" required></textarea>

                <button type="submit">Save progress note</button>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/roadsync :: footer}"></footer>
<script th:replace="~{fragments/roadsync :: login-dropdown-script}"></script>
</body>
</html>
