<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#0c1222"/>
    <title>Lesson Packages — RoadSync</title>
    <link rel="stylesheet" th:href="@{/landing.css}"/>
    <link rel="stylesheet" th:href="@{/subsystem.css}"/>
</head>
<body class="rs-landing">

<header th:replace="~{fragments/roadsync :: header('other')}"></header>

<main class="rs-main student-shell">
    <div th:replace="~{fragments/student-nav :: nav('packages')}"></div>

    <div class="student-hero">
        <h1>Lesson <span style="color: var(--rs-teal);">packages</span></h1>
        <p>Your student discount is applied automatically at checkout.</p>
    </div>

    <div class="table-container" style="max-width: 960px;">
        <h2 style="text-align: center;">Available packages</h2>
        <div class="rs-package-grid">
            <div class="rs-package-card" th:each="pkg : ${packages}">
                <h3 th:text="${pkg.packageName}">Package</h3>
                <p><strong th:text="${pkg.numberOfLessons}">0</strong> lessons</p>
                <p class="rs-package-price">Rs. <span th:text="${#numbers.formatDecimal(pkg.basePrice, 1, 'COMMA', 2, 'POINT')}">0.00</span></p>
                <p style="font-size: 0.85rem; color: var(--rs-muted); font-style: italic;">Discount applied at purchase.</p>
                <form th:action="@{/student/buy-package}" method="post">
                    <input type="hidden" name="packageId" th:value="${pkg.id}">
                    <button type="submit" class="rs-btn-buy" onclick="return confirm('Purchase this package?');">Buy now</button>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/roadsync :: footer}"></footer>
<script th:replace="~{fragments/roadsync :: login-dropdown-script}"></script>
</body>
</html>
