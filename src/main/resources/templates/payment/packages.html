<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/subsystem.css}">
    <title>Lesson Packages</title>
</head>
<body>
<nav>
    <span class="nav-brand">RoadSync Store</span>
    <a th:href="@{/student/dashboard}" class="nav-right">Back to Dashboard</a>
</nav>

<div class="table-container">
    <h2 style="text-align: center;">Available Lesson Packages</h2>
    <div class="student-grid" style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 20px;">
        <div class="student-card" th:each="pkg : ${packages}" style="text-align: center; border: 1px solid #ddd; padding: 20px; border-radius: 8px; width: 250px; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <h3 th:text="${pkg.packageName}"></h3>
            <p><strong th:text="${pkg.numberOfLessons}"></strong> Lessons</p>
            <h2 style="color: #28a745;">Rs. <span th:text="${#numbers.formatDecimal(pkg.basePrice, 1, 'COMMA', 2, 'POINT')}">0.00</span></h2>
            <p style="font-size: 0.85em; color: #666; font-style: italic; margin-bottom: 15px;">(Your student discount will be applied automatically!)</p>

            <form th:action="@{/student/buy-package}" method="post">
                <input type="hidden" name="packageId" th:value="${pkg.id}">
                <button type="submit" onclick="return confirm('Are you sure you want to purchase this lesson package?')" style="background-color: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%;">Buy Now</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
