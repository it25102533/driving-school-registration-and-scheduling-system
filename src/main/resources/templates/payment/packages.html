<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#0c1222"/>
    <title>Lesson Packages — RoadSync</title>
    <link rel="stylesheet" th:href="@{/landing.css}"/>
    <link rel="stylesheet" th:href="@{/subsystem.css}"/>
</head>
<body class="rs-landing">

<header th:replace="~{fragments/roadsync :: header('other')}"></header>

<main class="rs-main student-shell">
    <div th:replace="~{fragments/student-nav :: nav('packages')}"></div>

    <div class="student-hero">
        <h1>Lesson <span style="color: var(--rs-teal);">packages</span></h1>
        <p>Explore our premium driving lesson packages designed to fit your goals.</p>
    </div>

    <div class="rs-packages-section">
        <div class="rs-package-grid rs-package-grid--catalog">
            <article class="rs-package-card rs-package-card--photo" th:each="pkg : ${packages}">
                <div class="rs-package-card__media">
                    <img th:src="@{${pkg.imageUrl}}" th:alt="${pkg.packageName}" loading="lazy" width="800" height="500"/>
                </div>
                <div class="rs-package-card__body">
                    <h3 th:text="${pkg.packageName}">Package</h3>
                    <p class="rs-package-card__desc" th:text="${pkg.description}">Description</p>
                    <p class="rs-package-card__meta">
                        <span th:text="${pkg.numberOfLessons}">0</span> driving lessons
                    </p>
                    <p class="rs-package-price">
                        LKR <span th:text="${#numbers.formatDecimal(pkg.basePrice, 0, 'COMMA', 0, 'POINT')}">0</span>
                    </p>

                    <div style="margin-top: 1rem;">
                        <a th:href="@{/student/checkout(packageId=${pkg.id})}" class="rs-btn-buy" style="display: block; text-align: center; text-decoration: none;">
                            Select package
                        </a>
                    </div>
                </div>
            </article>
        </div>
        <p th:if="${#lists.isEmpty(packages)}" style="text-align: center; color: var(--rs-muted);">
            No packages available yet. Ask your instructor to configure pricing.
        </p>
    </div>
</main>

<footer th:replace="~{fragments/roadsync :: footer}"></footer>
<script th:replace="~{fragments/roadsync :: login-dropdown-script}"></script>
</body>
</html>
