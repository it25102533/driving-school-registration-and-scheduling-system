<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" th:href="@{/subsystem.css}">
  <title>Payment History</title>
</head>
<body>
<nav>
  <span class="nav-brand">RoadSync Store</span>
  <a th:href="@{/student/dashboard}" class="nav-right">Back to Dashboard</a>
</nav>

<div class="table-container">
  <h2>My Payment History</h2>

  <div th:if="${param.success}" style="color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb; padding: 10px; border-radius: 4px; text-align: center; font-weight: bold; margin-bottom: 20px;">
    🎉 Payment Processed Successfully!
  </div>

  <table>
    <thead>
    <tr>
      <th>Date</th>
      <th>Package Name</th>
      <th>Total Paid (After Discount)</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="pay : ${history}">
      <td th:text="${pay.formattedDate}"></td>
      <td th:text="${pay.packageName}"></td>
      <td style="color: #28a745; font-weight: bold;">Rs. <span th:text="${#numbers.formatDecimal(pay.amountPaid, 1, 'COMMA', 2, 'POINT')}">0.00</span></td>
    </tr>
    <tr th:if="${#lists.isEmpty(history)}">
      <td colspan="3" style="text-align: center; color: #888;">You have not purchased any packages yet.</td>
    </tr>
    </tbody>
  </table>

  <div style="text-align: center; margin-top: 20px;">
    <a th:href="@{/student/packages}" style="text-decoration: none; color: #007bff; font-weight: bold;">Browse More Packages</a>
  </div>
</div>
</body>
</html>
