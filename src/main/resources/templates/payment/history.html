<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#0c1222"/>
    <title>Payment History — RoadSync</title>
    <link rel="stylesheet" th:href="@{/landing.css}"/>
    <link rel="stylesheet" th:href="@{/subsystem.css}"/>
</head>
<body class="rs-landing">

<header th:replace="~{fragments/roadsync :: header('other')}"></header>

<main class="rs-main student-shell">
    <div th:replace="~{fragments/student-nav :: nav('pay')}"></div>

    <div class="student-hero">
        <h1>Payment <span style="color: var(--rs-teal);">history</span></h1>
        <p>Packages you have purchased.</p>
    </div>

    <div class="table-container">
        <h2>Transactions</h2>

        <div th:if="${param.success}" class="success-msg">
            Payment processed successfully.
        </div>

        <table>
            <thead>
            <tr>
                <th>Date</th>
                <th>Package</th>
                <th>Total paid</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="pay : ${history}">
                <td th:text="${pay.formattedDate}"></td>
                <td th:text="${pay.packageName}"></td>
                <td class="rs-status-ok">Rs. <span th:text="${#numbers.formatDecimal(pay.amountPaid, 1, 'COMMA', 2, 'POINT')}">0.00</span></td>
            </tr>
            <tr th:if="${#lists.isEmpty(history)}">
                <td colspan="3" style="text-align: center; color: var(--rs-muted);">No purchases yet.</td>
            </tr>
            </tbody>
        </table>

        <div style="text-align: center;">
            <a th:href="@{/student/packages}" class="rs-inline-link">Browse packages</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/roadsync :: footer}"></footer>
<script th:replace="~{fragments/roadsync :: login-dropdown-script}"></script>
</body>
</html>
