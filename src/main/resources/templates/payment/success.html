<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#0c1222"/>
    <title>Payment Successful — RoadSync</title>
    <link rel="stylesheet" th:href="@{/landing.css}"/>
    <link rel="stylesheet" th:href="@{/subsystem.css}"/>
    <style>
        .success-container {
            max-width: 600px;
            margin: 4rem auto;
            background: var(--rs-surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: rgba(46, 213, 115, 0.1);
            color: #2ed573;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .success-container h1 {
            color: var(--rs-text);
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }

        .success-container p {
            color: var(--rs-muted);
            margin-bottom: 2rem;
        }

        .payment-details {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }
        
        .detail-row:last-child {
            margin-bottom: 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 0.75rem;
            font-weight: bold;
            color: var(--rs-text);
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-download {
            background: var(--rs-primary);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.2s;
        }

        .btn-download:hover {
            background: var(--rs-primary-hover);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--rs-text);
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="rs-landing">

<header th:replace="~{fragments/roadsync :: header('other')}"></header>

<main class="rs-main student-shell">
    <div th:replace="~{fragments/student-nav :: nav('pay')}"></div>

    <div class="success-container">
        <div class="success-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        
        <h1>Payment Successful!</h1>
        <p>Thank you for your purchase. Your transaction has been completed.</p>

        <div class="payment-details">
            <div class="detail-row">
                <span style="color: var(--rs-muted);">Transaction ID</span>
                <span th:text="${'#' + payment.id}" style="color: var(--rs-text);">#12345</span>
            </div>
            <div class="detail-row">
                <span style="color: var(--rs-muted);">Package</span>
                <span th:text="${payment.lessonPackage.packageName}" style="color: var(--rs-text);">Standard Package</span>
            </div>
            <div class="detail-row">
                <span style="color: var(--rs-muted);">Total Paid</span>
                <span>LKR <span th:text="${#numbers.formatDecimal(payment.amountPaid, 0, 'COMMA', 0, 'POINT')}">0</span></span>
            </div>
        </div>

        <div class="action-buttons">
            <a th:href="@{/student/invoice/{id}(id=${payment.id})}" target="_blank" class="btn-download">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download Invoice (PDF)
            </a>
            <a th:href="@{/student/payment-history}" class="btn-secondary">
                View History
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/roadsync :: footer}"></footer>
<script th:replace="~{fragments/roadsync :: login-dropdown-script}"></script>
</body>
</html>
