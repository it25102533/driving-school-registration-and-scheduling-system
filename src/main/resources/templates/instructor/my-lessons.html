<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/subsystem.css}">
    <title>My Lessons</title>
</head>
<body>
<nav>
    <span class="nav-brand">RoadSync Staff</span>
    <a th:href="@{/instructor/dashboard}" class="nav-right">Dashboard</a>
</nav>

<div class="table-container">
    <h2>Lessons assigned to me</h2>

    <table>
        <thead>
        <tr>
            <th>Date &amp; Time</th>
            <th>Student</th>
            <th>Vehicle</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="lesson : ${lessons}">
            <td th:text="${lesson.formattedDate}" style="font-weight: bold;"></td>
            <td th:text="${lesson.studentName}"></td>
            <td th:text="${lesson.vehicleModel}"></td>
            <td>
                <span th:text="${lesson.status}"
                      th:style="${lesson.status == 'CANCELLED'} ? 'color: red; font-weight: bold;' : 'color: green; font-weight: bold;'"></span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(lessons)}">
            <td colspan="4" style="text-align: center; color: #888;">No lessons scheduled yet.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
