<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#0c1222"/>
    <title>Add Instructor — RoadSync</title>
    <link rel="stylesheet" th:href="@{/landing.css}"/>
    <link rel="stylesheet" th:href="@{/subsystem.css}"/>
</head>
<body class="rs-landing">

<header th:replace="~{fragments/roadsync :: header('other')}"></header>

<main class="rs-main student-shell">
    <nav th:replace="~{fragments/roadsync :: staffToolbar}"></nav>

    <div class="rs-page-nav">
        <span class="nav-brand">New instructor</span>
        <div class="nav-links">
            <a th:href="@{/instructors}">Back to list</a>
        </div>
    </div>

    <div class="form-wrapper">
        <div class="form-container rs-form-wide">
            <h2>Register instructor</h2>

            <form th:action="@{/instructors/save}" th:object="${instructor}" method="post">
                <label for="name">Full name</label>
                <input type="text" id="name" th:field="*{name}" required>

                <label for="phone">Phone</label>
                <input type="text" id="phone" th:field="*{phone}" required>

                <label for="licenseNumber">License number</label>
                <input type="text" id="licenseNumber" th:field="*{licenseNumber}" placeholder="e.g. INST-54321" required>

                <label for="specialization">Specialization</label>
                <input type="text" id="specialization" th:field="*{specialization}" placeholder="e.g. Heavy vehicles" required>

                <label for="email">Work email (login)</label>
                <input type="email" id="email" th:field="*{email}" required>

                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" required>

                <p th:if="${error}" class="error-msg" th:text="${error}"></p>

                <button type="submit">Save instructor</button>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/roadsync :: footer}"></footer>
<script th:replace="~{fragments/roadsync :: login-dropdown-script}"></script>
</body>
</html>
