<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#0c1222"/>
    <title>Instructors — RoadSync</title>
    <link rel="stylesheet" th:href="@{/landing.css}"/>
    <link rel="stylesheet" th:href="@{/subsystem.css}"/>
    <script th:src="@{/script.js}" defer></script>
</head>
<body class="rs-landing">

<header th:replace="~{fragments/roadsync :: header('other')}"></header>

<main class="rs-main student-shell">
    <nav th:replace="~{fragments/roadsync :: staffToolbar}"></nav>

    <div class="student-hero">
        <h1>Instructor <span style="color: var(--rs-teal);">roster</span></h1>
        <p>Staff profiles and login credentials.</p>
    </div>

    <div class="table-container">
        <h2>Driving instructors</h2>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>License</th>
                <th>Specialization</th>
                <th>Assigned Vehicle</th>
                <th>Email</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="inst : ${allInstructors}">
                <td th:text="${inst.id}"></td>
                <td th:text="${inst.name}" style="font-weight: 600;"></td>
                <td th:text="${inst.phone}"></td>
                <td th:text="${inst.licenseNumber}"></td>
                <td th:text="${inst.specialization}"></td>
                <td th:text="${inst.assignedVehicleName != null ? inst.assignedVehicleName : 'None'}"></td>
                <td th:text="${inst.email}"></td>
                <td>
                    <a th:href="@{/instructors/edit(id=${inst.id})}" class="edit-btn">Edit</a>
                    <a th:href="@{/instructors/delete(id=${inst.id})}" class="delete-btn"
                       onclick="return confirm('Remove this instructor?');">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>

        <div style="text-align: center;">
            <a th:href="@{/instructors/add}" class="rs-inline-link">+ Add instructor</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/roadsync :: footer}"></footer>
<script th:replace="~{fragments/roadsync :: login-dropdown-script}"></script>
</body>
</html>
