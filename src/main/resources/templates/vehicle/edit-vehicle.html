<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#0c1222"/>
    <title>Edit Vehicle — RoadSync</title>
    <link rel="stylesheet" th:href="@{/landing.css}"/>
    <link rel="stylesheet" th:href="@{/subsystem.css}"/>
</head>
<body class="rs-landing">

<header th:replace="~{fragments/roadsync :: header('other')}"></header>

<main class="rs-main student-shell">
    <nav th:replace="~{fragments/roadsync :: staffToolbar}"></nav>

    <div class="rs-page-nav">
        <span class="nav-brand">Edit vehicle</span>
        <div class="nav-links">
            <a th:href="@{/vehicles}">Cancel</a>
        </div>
    </div>

    <div class="form-wrapper">
        <div class="form-container rs-form-wide">
            <h2>Vehicle details</h2>
            <p th:if="${error}" class="error-msg" th:text="${error}" style="color: #f87171; background: rgba(248, 113, 113, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 1rem; text-align: center; border: 1px solid #f87171;"></p>
            <form th:action="@{/vehicles/update}" th:object="${vehicle}" method="post">
                <input type="hidden" th:field="*{id}">

                <label for="model">Model</label>
                <input type="text" id="model" th:field="*{model}" required>

                <label for="plateNumber">Plate number</label>
                <input type="text" id="plateNumber" th:field="*{plateNumber}" required>

                <label for="type">Transmission / fuel</label>
                <input type="text" id="type" th:field="*{type}" required>

                <button type="submit">Update vehicle</button>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/roadsync :: footer}"></footer>
<script th:replace="~{fragments/roadsync :: login-dropdown-script}"></script>
</body>
</html>
