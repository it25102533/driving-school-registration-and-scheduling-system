<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#0c1222"/>
    <title>Fleet — RoadSync</title>
    <link rel="stylesheet" th:href="@{/landing.css}"/>
    <link rel="stylesheet" th:href="@{/subsystem.css}"/>
    <script th:src="@{/script.js}" defer></script>
</head>
<body class="rs-landing">

<header th:replace="~{fragments/roadsync :: header('other')}"></header>

<main class="rs-main student-shell">
    <nav th:replace="~{fragments/roadsync :: staffToolbar}"></nav>

    <div class="student-hero">
        <h1>Vehicle <span style="color: var(--rs-teal);">fleet</span></h1>
        <p>Manage models, plates, and transmission types.</p>
    </div>

    <div class="table-container">
        <h2>All vehicles</h2>
        
        <p th:if="${error}" class="error-msg" th:text="${error}" style="text-align: center; color: #f87171; background: rgba(248, 113, 113, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 1rem;"></p>
        <p th:if="${success}" class="success-msg" th:text="${success}" style="text-align: center; color: var(--rs-teal); background: rgba(0, 204, 153, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 1rem;"></p>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Model</th>
                <th>Plate</th>
                <th>Type</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v : ${allVehicles}">
                <td th:text="${v.id}"></td>
                <td th:text="${v.model}"></td>
                <td th:text="${v.plateNumber}"></td>
                <td th:text="${v.type}"></td>
                <td>
                    <a th:href="@{/vehicles/edit(id=${v.id})}" class="edit-btn">Edit</a>
                    <a th:href="@{/vehicles/delete(id=${v.id})}" class="delete-btn"
                       onclick="return confirm('Delete this vehicle?');">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>

        <div style="text-align: center;">
            <a th:href="@{/vehicles/add}" class="rs-inline-link">+ Add vehicle</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/roadsync :: footer}"></footer>
<script th:replace="~{fragments/roadsync :: login-dropdown-script}"></script>
</body>
</html>
