<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/subsystem.css}">
    <title>Book a Lesson</title>
</head>
<body>
<nav>
    <span class="nav-brand">RoadSync Scheduling</span>
    <a th:href="@{/student/dashboard}" class="nav-right">Back to Dashboard</a>
</nav>

<div class="form-wrapper">
    <div class="form-container">
        <h2>Book a Driving Lesson</h2>

        <form th:action="@{/student/book-lesson/save}" th:object="${lesson}" method="post">

            <label for="instructorId">Select Instructor:</label>
            <select id="instructorId" th:field="*{instructorId}" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc;">
                <option value="" disabled selected>-- Choose an Instructor --</option>
                <option th:each="inst : ${instructors}" th:value="${inst.id}" th:text="${inst.name}"></option>
            </select>

            <label for="vehicleId">Select Vehicle (Optional):</label>
            <select id="vehicleId" th:field="*{vehicleId}" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc;">
                <option value="">-- Let school decide --</option>
                <option th:each="veh : ${vehicles}" th:value="${veh.id}" th:text="${veh.model} + ' (' + ${veh.type} + ')'"></option>
            </select>

            <label for="vehicleType">Vehicle Transmission Preference:</label>
            <select id="vehicleType" th:field="*{vehicleType}" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc;">
                <option value="Automatic">Automatic</option>
                <option value="Manual">Manual</option>
                <option value="Any">Any</option>
            </select>

            <label for="lessonTime">Select Date & Time:</label>
            <input type="datetime-local" id="lessonTime" th:field="*{lessonTime}" required>

            <button type="submit">Confirm Booking</button>
        </form>
    </div>
</div>
</body>
</html>
