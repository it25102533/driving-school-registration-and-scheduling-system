<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#0c1222"/>
    <title>Schedule Lesson — RoadSync</title>
    <link rel="stylesheet" th:href="@{/landing.css}"/>
    <link rel="stylesheet" th:href="@{/subsystem.css}"/>
</head>
<body class="rs-landing">

<header th:replace="~{fragments/roadsync :: header('other')}"></header>

<main class="rs-main student-shell">
    <div th:replace="~{fragments/student-nav :: nav('lessons')}"></div>

    <div class="student-hero">
        <h1>Schedule your <span style="color: var(--rs-teal);">lesson</span></h1>
        <p>Set a date, time, and vehicle preference for your package lesson.</p>
    </div>

    <div class="form-wrapper">
        <div class="form-container rs-form-wide">
            <h2>Schedule Lesson</h2>
            <p th:if="${error}" class="error-msg" th:text="${error}" style="color: #f87171; background: rgba(248, 113, 113, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 1rem; text-align: center; border: 1px solid #f87171;"></p>

            <form th:action="@{/student/schedule-lesson/save}" th:object="${lesson}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <label for="instructorId">Instructor</label>
                <select id="instructorId" th:field="*{instructorId}" required>
                    <option th:each="inst : ${instructors}" th:value="${inst.id}" th:text="${inst.name}"></option>
                </select>

                <label for="vehicleId">Vehicle (optional)</label>
                <select id="vehicleId" th:field="*{vehicleId}">
                    <option value="">— Let the school decide —</option>
                    <option th:each="veh : ${vehicles}" th:value="${veh.id}" th:text="${veh.model} + ' (' + ${veh.type} + ')'"></option>
                </select>

                <label for="vehicleType">Transmission preference</label>
                <select id="vehicleType" th:field="*{vehicleType}">
                    <option value="Automatic">Automatic</option>
                    <option value="Manual">Manual</option>
                    <option value="Any">Any</option>
                </select>

                <label for="lessonTime">Date &amp; time</label>
                <input type="datetime-local" id="lessonTime" th:field="*{lessonTime}" required>

                <button type="submit">Schedule Lesson</button>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/roadsync :: footer}"></footer>
<script th:replace="~{fragments/roadsync :: login-dropdown-script}"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    var vehicleTypeSelect = document.getElementById("vehicleType");
    var vehicleSelect = document.getElementById("vehicleId");
    if (!vehicleTypeSelect || !vehicleSelect) return;

    var originalOptions = Array.from(vehicleSelect.options);

    function filterVehicles() {
        var selectedType = vehicleTypeSelect.value;
        var currentValue = vehicleSelect.value;

        vehicleSelect.innerHTML = "";

        originalOptions.forEach(function(opt) {
            if (opt.value === "") {
                vehicleSelect.appendChild(opt);
                return;
            }

            var text = opt.text.toLowerCase();
            if (selectedType === "Any" || selectedType === "" || text.includes(selectedType.toLowerCase())) {
                vehicleSelect.appendChild(opt);
            }
        });

        if (Array.from(vehicleSelect.options).some(function(opt) { return opt.value === currentValue; })) {
            vehicleSelect.value = currentValue;
        } else {
            vehicleSelect.value = "";
        }
    }

    vehicleTypeSelect.addEventListener("change", filterVehicles);
    filterVehicles();
});
</script>
</body>
</html>
