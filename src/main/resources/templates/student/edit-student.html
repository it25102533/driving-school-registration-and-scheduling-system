<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/student/subsystem.css}">
    <title>Edit Student | RoadSync</title>
</head>
<body>
<nav>
    <div class="nav-brand">RoadSync Admin</div>
    <div class="nav-links">
        <a th:href="@{/students}">Back to List</a>
        <a th:href="@{/logout}" class="btn-logout">Logout</a>
    </div>
</nav>

<div class="form-wrapper">
    <div class="form-container">
        <h2>Edit Student Information</h2>

        <form th:action="@{/updateStudent}" th:object="${student}" method="post">
            <!-- Hidden ID field is essential for JPA to know which record to update -->
            <input type="hidden" th:field="*{id}">

            <label for="name">Full Name:</label>
            <input type="text" id="name" th:field="*{name}" required>

            <label for="age">Age:</label>
            <input type="number" id="age" th:field="*{age}" required>

            <label for="licenseType">License Type:</label>
            <input type="text" id="licenseType" th:field="*{licenseType}" required>

            <label for="phone">Phone:</label>
            <input type="text" id="phone" th:field="*{phone}" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" th:field="*{email}" required>

            <label for="password">New Password:</label>
            <input type="password" id="password" th:field="*{password}" placeholder="Leave blank to keep current">

            <label for="address">Address:</label>
            <input type="text" id="address" th:field="*{address}">

            <button type="submit">Update Student</button>
        </form>
    </div>
</div>

<!-- Include script.js if you want any general interactions -->
<script th:src="@{/js/script.js}"></script>
</body>
</html>
