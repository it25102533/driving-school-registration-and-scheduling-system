<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#0c1222"/>
    <title>Edit Student — RoadSync</title>
    <link rel="stylesheet" th:href="@{/landing.css}"/>
    <link rel="stylesheet" th:href="@{/subsystem.css}"/>
    <script th:src="@{/script.js}" defer></script>
</head>
<body class="rs-landing">

<header th:replace="~{fragments/roadsync :: header('other')}"></header>

<main class="rs-main student-shell">
    <nav th:replace="~{fragments/roadsync :: staffToolbar}"></nav>

    <div class="rs-page-nav">
        <span class="nav-brand">Edit student</span>
        <div class="nav-links">
            <a th:href="@{/students}">Back to list</a>
            <a th:href="@{/logout}" class="btn-logout">Logout</a>
        </div>
    </div>

    <div class="form-wrapper">
        <div class="form-container rs-form-wide">
            <h2>Student information</h2>

            <form th:action="@{/updateStudent}" th:object="${student}" method="post">
                <input type="hidden" th:field="*{id}">

                <label for="name">Full name</label>
                <input type="text" id="name" th:field="*{name}" required>

                <label for="age">Age</label>
                <input type="number" id="age" th:field="*{age}" required>

                <label for="licenseType">License type</label>
                <input type="text" id="licenseType" th:field="*{licenseType}" required>

                <label for="phone">Phone</label>
                <input type="text" id="phone" th:field="*{phone}" required>

                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" required>

                <label for="password">New password</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Leave blank to keep current">

                <label for="address">Address</label>
                <input type="text" id="address" th:field="*{address}">

                <button type="submit">Update student</button>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/roadsync :: footer}"></footer>
<script th:replace="~{fragments/roadsync :: login-dropdown-script}"></script>
</body>
</html>
