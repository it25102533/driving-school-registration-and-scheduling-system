<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/student/subsystem.css}">
    <title>Student Login | RoadSync</title>
</head>
<body>
<div class="form-wrapper">
    <div class="form-container">
        <h2>Student Login</h2>

        <!-- Logic for the 'Required Login' message from the Interceptor -->
        <div th:if="${requiredLogin}" class="error-msg">
            <span>Please login to access the dashboard.</span>
        </div>

        <!-- Logic for invalid credentials error -->
        <div th:if="${error != null}" class="error-msg">
            <span th:text="${error}"></span>
        </div>

        <!-- Logic for success message after registration -->
        <div th:if="${param.success}" class="success-msg">
            <span>Registration successful! Please login.</span>
        </div>

        <form th:action="@{/login}" method="post">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password">

            <button type="submit">Login</button>
        </form>

        <div style="text-align: center; margin-top: 15px;">
            <p>Don't have an account?
                <a th:href="@{/register}" style="color: #007bff; text-decoration: none; font-weight: bold;">Create an account</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
