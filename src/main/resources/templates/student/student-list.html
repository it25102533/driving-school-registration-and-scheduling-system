<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/student/subsystem.css}">
    <title>Student List</title>
</head>
<body>

<nav>
    <a href="/register">Register</a>
    <a href="/students">Students</a>
    <a href="/login" style="color: #ffc107; border: 1px solid #ffc107; padding: 5px 10px; border-radius: 4px;">Student Login</a>
    <a href="/logout" style="color: #dc3545; font-size: 0.9em;">Logout</a>
</nav>

<div class="table-container">
    <h2>Driving School Students</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>License Type</th>
            <th>Student Type</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${allStudents}">
            <td th:text="${s.id}"></td>
            <td th:text="${s.name}"></td>
            <td th:text="${s.email}"></td>
            <td th:text="${s.age}"></td>
            <td th:text="${s.licenseType}"></td>
            <td th:text="${s.studentType}"></td>
            <td th:text="${s.phone}"></td>
            <td th:text="${s.address}"></td>
            <td>
                <a th:href="@{/editStudent(id=${s.id})}" class="edit-btn">Edit</a>
                <a th:href="@{/deleteStudent(id=${s.id})}" onclick="return confirm('Are you sure you want to delete this student?')" class="delete-btn">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div style="text-align: center; margin-top: 20px;">
        <a href="/register" style="text-decoration: none; color: #28a745; font-weight: bold; border: 2px solid #28a745; padding: 10px 20px; border-radius: 5px; display: inline-block;">+ Register New Student</a>
    </div>
</div>

</body>
</html>
