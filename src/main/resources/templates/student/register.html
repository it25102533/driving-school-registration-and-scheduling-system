<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/student/subsystem.css}">
    <title>Driving School Registration</title>
</head>
<body>
<nav>
    <a href="/login">Student Login</a>
    <a href="/students">View Students</a>
</nav>

<div class="container">
    <h2>New Student Registration</h2>

    <div th:if="${param.success}" class="success">
        Student Registered Successfully! You can now log in.
    </div>
    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form th:action="@{/saveStudent}" th:object="${student}" method="post">
        <label>Full Name:</label>
        <input type="text" th:field="*{name}" required>

        <label>Age:</label>
        <input type="number" th:field="*{age}" required min="17">

        <label>License Type:</label>
        <input type="text" th:field="*{licenseType}" placeholder="e.g., Light Vehicle" required>

        <label>Student Type:</label>
        <select th:field="*{studentType}">
            <option value="Standard">Standard</option>
            <option value="Corporate">Corporate</option>
        </select>

        <label>Phone:</label>
        <input type="text" th:field="*{phone}" required>

        <label>Email:</label>
        <input type="email" th:field="*{email}" required>

        <label>Password (For Login):</label>
        <input type="password" th:field="*{password}" required>

        <label>Address:</label>
        <input type="text" th:field="*{address}">

        <button type="submit" class="btn-success">Submit Registration</button>
    </form>
</div>
</body>
</html>
