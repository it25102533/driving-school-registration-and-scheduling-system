<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/student/subsystem.css}">
    <title>Driving School Registration | RoadSync</title>
</head>
<body>
<nav>
    <div class="nav-brand">RoadSync</div>
    <div class="nav-links">
        <a th:href="@{/login}" class="btn-login">Student Login</a>
    </div>
</nav>

<div class="form-wrapper">
    <div class="form-container">
        <h2>New Student Registration</h2>

        <!-- Success Message -->
        <div th:if="${param.success}" class="success-msg">
            Student Registered Successfully!
        </div>

        <!-- Error Message (Captures 'Email already registered' etc. from Controller) -->
        <div th:if="${error != null}" class="error-msg">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/saveStudent}" th:object="${student}" method="post">
            <label for="name">Full Name:</label>
            <input type="text" id="name" th:field="*{name}" required>

            <label for="age">Age:</label>
            <input type="number" id="age" th:field="*{age}" required min="18">

            <label for="licenseType">License Type:</label>
            <input type="text" id="licenseType" th:field="*{licenseType}" placeholder="e.g., Light Vehicle" required>

            <label for="phone">Phone:</label>
            <input type="text" id="phone" th:field="*{phone}" required>

            <label for="email">Email:</label>
            <input type="email" id="email" th:field="*{email}" required>

            <label for="password">Password:</label>
            <input type="password" id="password" th:field="*{password}" required>

            <label for="address">Address:</label>
            <input type="text" id="address" th:field="*{address}">

            <button type="submit">Submit Registration</button>
        </form>

        <div style="text-align: center; margin-top: 15px;">
            <p>Already have an account?
                <a th:href="@{/login}" style="color: #007bff; text-decoration: none; font-weight: bold;">Login here</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
